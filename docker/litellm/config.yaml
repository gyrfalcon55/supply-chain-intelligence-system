model_list:
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 6

  - model_name: gpt
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 6

  - model_name: llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 6

router_settings:
  fallbacks:
    - gpt:
        - gemini
    - llama:
        - gemini