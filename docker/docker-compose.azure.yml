services:

  postgres:
    image: postgres:16
    container_name: supplychain-postgres
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: SupplyChainDatabase

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d SupplyChainDatabase" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: sjunaid884doc/supplychain-backend:latest
    container_name: supplychain-backend
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/SupplyChainDatabase
      MODEL_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/MLflowDatabase
      GROQ_API_KEY: ${GROQ_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: supplychain-mlflow
    restart: unless-stopped

    command: >
      mlflow server --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/MLflowDatabase --default-artifact-root /mlartifacts --host 0.0.0.0 --port 5000

    volumes:
      - mlflow_artifacts:/mlartifacts

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

  frontend:
    image: sjunaid884doc/supplychain-frontend:latest
    container_name: supplychain-frontend
    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend

    ports:
      - "8501:8501"

volumes:
  postgres_data:
  mlflow_artifacts:
