name: Deploy Supply Chain System

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 4. Run automated tests
      - name: Run tests
        run: |
          pytest -v

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build backend image
      - name: Build backend image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest \
            .

      # 7. Push backend image
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest

      # 8. Build frontend image
      - name: Build frontend image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest \
            .

      # 9. Push frontend image
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest

      # 10. Deploy to Azure VM
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/supply-chain-ai

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest

            docker compose \
              --env-file .env \
              -f docker/docker-compose.azure.yml \
              up -d --force-recreate backend frontend

            docker image prune -f