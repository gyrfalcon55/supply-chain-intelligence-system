name: Deploy Supply Chain System

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build backend image
      - name: Build backend image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest \
            .

      # 4. Push backend image
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest

      # 5. Build frontend image
      - name: Build frontend image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest \
            .

      # 6. Push frontend image
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest

      # 7. Deploy to Azure VM
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/supply-chain-ai

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-frontend:latest

            docker compose \
              --env-file .env \
              -f docker/docker-compose.azure.yml \
              up -d --force-recreate backend frontend litellm

            docker image prune -f